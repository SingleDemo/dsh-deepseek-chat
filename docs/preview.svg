<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A chat panel with a conversation rail, a search-backed answer, and a composer toolbar">
  <defs>
    <linearGradient id="pvUser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B4253"/>
      <stop offset="1" stop-color="#2E3442"/>
    </linearGradient>
    <linearGradient id="pvBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E8CFF"/>
      <stop offset="1" stop-color="#3B54DE"/>
    </linearGradient>
    <linearGradient id="pvSend" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B93FF"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="640" height="300" rx="18" fill="#0B0F16"/>
  <rect x="0.75" y="0.75" width="638.5" height="298.5" rx="17.25" fill="none" stroke="#252C3B" stroke-width="1.5"/>

  <!-- conversation rail -->
  <rect x="20" y="18" width="168" height="246" rx="12" fill="#12161F"/>
  <line x1="189" y1="24" x2="189" y2="258" stroke="#232A38" stroke-width="1"/>
  <rect x="34" y="34" width="18" height="18" rx="5" fill="url(#pvBrand)"/>
  <rect x="58" y="39" width="52" height="8" rx="4" fill="#C9D2E4"/>
  <rect x="34" y="62" width="140" height="26" rx="9" fill="#1B2130" stroke="#33405C" stroke-width="1"/>
  <rect x="64" y="72" width="60" height="6" rx="3" fill="#7C8AA6"/>
  <rect x="30" y="102" width="148" height="30" rx="9" fill="#1E2536"/>
  <rect x="42" y="109" width="98" height="6" rx="3" fill="#8C99B4"/>
  <rect x="42" y="119" width="60" height="5" rx="2.5" fill="#4E5A72"/>
  <rect x="42" y="148" width="86" height="6" rx="3" fill="#5A6580"/>
  <rect x="42" y="160" width="52" height="5" rx="2.5" fill="#3E4860"/>
  <rect x="42" y="182" width="104" height="6" rx="3" fill="#3E4860"/>
  <rect x="42" y="194" width="72" height="5" rx="2.5" fill="#3E4860"/>
  <circle cx="44" cy="240" r="7" fill="#1E2536" stroke="#3B4763" stroke-width="1.2"/>
  <rect x="58" y="237" width="42" height="6" rx="3" fill="#3E4860"/>

  <!-- chat header -->
  <rect x="208" y="32" width="8" height="8" rx="4" fill="#4E5A72"/>
  <rect x="224" y="33" width="104" height="8" rx="4" fill="#C9D2E4"/>
  <rect x="536" y="29" width="58" height="14" rx="7" fill="#1B2130" stroke="#33405C" stroke-width="1"/>
  <line x1="208" y1="54" x2="606" y2="54" stroke="#1F2634" stroke-width="1"/>

  <!-- user message -->
  <rect x="394" y="66" width="212" height="32" rx="14" fill="url(#pvUser)"/>
  <rect x="408" y="76" width="152" height="6" rx="3" fill="#DCE3F1"/>
  <rect x="408" y="86" width="98" height="6" rx="3" fill="#B7C1D6"/>

  <!-- assistant message -->
  <rect x="208" y="112" width="15" height="15" rx="4" fill="url(#pvBrand)"/>
  <rect x="232" y="116" width="52" height="7" rx="3.5" fill="#DCE3F1"/>
  <rect x="208" y="136" width="88" height="20" rx="10" fill="none" stroke="#333D52" stroke-width="1"/>
  <rect x="218" y="143" width="48" height="6" rx="3" fill="#7C8AA6"/>
  <rect x="270" y="144" width="6" height="6" rx="2" fill="#5A6580"/>

  <!-- answer body -->
  <rect x="208" y="168" width="390" height="7" rx="3.5" fill="#C9D2E4"/>
  <rect x="208" y="182" width="356" height="7" rx="3.5" fill="#93A0BA"/>
  <rect x="208" y="196" width="300" height="7" rx="3.5" fill="#93A0BA"/>

  <!-- sources pill -->
  <circle cx="218" cy="215" r="6" fill="none" stroke="#4D6BFE" stroke-width="1.2"/>
  <rect x="230" y="212" width="46" height="6" rx="3" fill="#6C7893"/>
  <rect x="282" y="213" width="5" height="5" rx="1.5" fill="#4E5A72"/>

  <!-- composer -->
  <rect x="208" y="228" width="398" height="50" rx="13" fill="#12161F" stroke="#2E384C" stroke-width="1"/>
  <rect x="222" y="238" width="96" height="6" rx="3" fill="#5A6580"/>
  <g fill="none" stroke="#333D52" stroke-width="1">
    <rect x="220" y="252" width="42" height="16" rx="8"/>
    <rect x="268" y="252" width="56" height="16" rx="8"/>
    <rect x="330" y="252" width="24" height="16" rx="8"/>
    <rect x="360" y="252" width="38" height="16" rx="8"/>
  </g>
  <rect x="228" y="257" width="26" height="5" rx="2.5" fill="#7C8AA6"/>
  <rect x="276" y="257" width="40" height="5" rx="2.5" fill="#7C8AA6"/>
  <g fill="#5A6580">
    <circle cx="342" cy="260" r="2.4"/>
    <rect x="348" y="258.6" width="3.6" height="3.6" rx="1.2"/>
  </g>
  <circle cx="590" cy="260" r="12" fill="url(#pvSend)"/>
  <path d="M585 260h10M590 255v10" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round"/>

  <path d="M612 16l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z" fill="#4D6BFE" opacity="0.7"/>
  <circle cx="20" cy="284" r="2.5" fill="#4D6BFE" opacity="0.45"/>
</svg>
