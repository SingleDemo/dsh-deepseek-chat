<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenCode local model router">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="flow" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- incoming request -->
  <circle cx="16" cy="32" r="5" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <!-- routing fan-out -->
  <path d="M21 32h9" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30 32c8 0 8-12 16-12" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M30 32h16" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30 32c8 0 8 12 16 12" stroke="url(#flow)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- upstreams -->
  <circle cx="50" cy="20" r="4" fill="#38BDF8"/>
  <circle cx="50" cy="32" r="4" fill="#7DD3FC"/>
  <circle cx="50" cy="44" r="4" fill="#A78BFA"/>
</svg>
